version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.web
    container_name: lab-web
    ports:
      - "5000:5000"
    environment:
      - APP_ENV=production
      - PORT=5000
    networks:
      - lab-network
    depends_on:
      - api
      - database
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  api:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.api
    container_name: lab-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - lab-network
    depends_on:
      - database
      - cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  database:
    image: postgres:15-alpine
    container_name: lab-database
    environment:
      - POSTGRES_USER=labuser
      - POSTGRES_PASSWORD=labpass123
      - POSTGRES_DB=labdb
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - lab-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7-alpine
    container_name: lab-cache
    command: redis-server --appendonly yes
    volumes:
      - cache-data:/data
    networks:
      - lab-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  lab-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  db-data:
    driver: local
  cache-data:
    driver: local
